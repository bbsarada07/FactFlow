<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FactFlow — Options</title>
    <style>
      body { margin: 0; padding: 32px; background: #040407; color: #F0F0F5; font-family: Inter, "Segoe UI", system-ui, sans-serif; font-size: 14px; }
      main { max-width: 480px; }
      h1 { font-size: 18px; margin: 0 0 20px; }
      p { color: #8888A0; line-height: 1.55; }
      .row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid #2A2A3A; border-radius: 10px; background: #111118; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #8888A0; flex: none; }
      .dot.on { background: #00E676; }
      button, a.button { display: inline-block; margin-top: 14px; padding: 9px 22px; border: 0; border-radius: 100px; background: #FF2D2D; color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 13px; }
      button.ghost { background: transparent; border: 1px solid #2A2A3A; color: #F0F0F5; }
    </style>
  </head>
  <body>
    <main>
      <h1>FactFlow — Options</h1>
      <div class="row"><span id="dot" class="dot"></span><span id="state">Checking…</span></div>
      <p id="help"></p>
      <a id="open" class="button" href="#" target="_blank" rel="noopener">Open FactFlow settings</a>
      <button id="disconnect" class="ghost" type="button" hidden>Disconnect this browser</button>
    </main>
    <script src="options.js"></script>
  </body>
</html>
